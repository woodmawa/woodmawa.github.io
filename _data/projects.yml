# Projects shown on /projects/. One entry per repository.
#   repo      GitHub repository name (exact case). Also the key posts use in `project:` front matter.
#   category  accordion heading; projects with the same category are grouped
#   version / coordinates / central   optional; shown when present
#   docs      list of {title, url} links shown on the Documentation tab
# Public repositories not listed here still appear under "Other Projects" (fetched from GitHub in the browser).

- repo: groovy-HttpClient
  name: groovy-HttpClient
  category: Core Libraries
  version: 2.1.0
  coordinates: io.github.woodmawa:groovy-httpclient:2.1.0
  central: https://central.sonatype.com/artifact/io.github.woodmawa/groovy-httpclient
  summary: >-
    A production-ready HTTP client for Groovy and Java, built on the JDK HttpClient and virtual threads:
    secure defaults, HTTP/1.1, HTTP/2 and HTTP/3, a Groovy request DSL, and a testing toolkit you can
    use in your own tests.
  requirements: Java 25+ (HTTP/3 needs JDK 26+), Groovy 6.0+, any SLF4J 2.x binding
  features:
    - HTTP/1.1, HTTP/2 and opt-in HTTP/3 (JDK 26+), with HTTP/2 fallback on JDK 25
    - Secure by default -- certificate and host name verification, host allow-listing, redirects only to allowed hosts
    - Groovy request DSL with codecs for JSON, XML, CSV, form and text, plus optional Jackson and typed results
    - Response handlers -- success, when(status), failure and exception closures
    - RFC 9457 problem details and log-safe HttpResponseException messages
    - Streaming downloads and uploads; line, Server-Sent Event and NDJSON consumers
    - Opt-in gzip/deflate with a decompression size guard
    - Basic, bearer, API key and OAuth2 client-credentials authentication; explicit HTTP proxy support
    - Retry policies, circuit breaker with inspection, per-client metrics
    - Published test fixtures -- MockHttpServer, HttpClientTestDsl and a Spock trait
  docs:
    - title: README and quick start
      url: https://github.com/woodmawa/groovy-HttpClient#readme
    - title: User guide (PDF)
      url: https://woodmawa.github.io/downloads/groovy-httpclient/groovy-httpclient-user-guide-2.1.0.pdf
    - title: SSL certificate guide
      url: https://github.com/woodmawa/groovy-HttpClient/blob/master/SSL_CERTIFICATE_GUIDE.md
